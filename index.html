<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengalihan Alamat</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade {
      animation: fadeIn 1.2s ease-out forwards;
    }
  </style>
</head>
<body class="relative min-h-screen overflow-hidden">

  <!-- Video Background -->
  <video
    autoplay
    muted
    loop
    playsinline
    class="absolute inset-0 w-full h-full object-cover">
    <source src="https://cdn.dribbble.com/userupload/46110669/file/daa24dc325473cc6c72763b387d227c5.mp4" type="video/mp4">
  </video>

  <!-- Overlay tipis -->
  <div class="absolute inset-0 bg-black/40"></div>

  <!-- Bottom Content -->
  <div class="absolute bottom-0 left-0 right-0 z-10 animate-fade">
    <div class="bg-black/55 backdrop-blur-sm px-6 py-4">

      <p class="text-center text-sm md:text-base text-gray-200 leading-relaxed">
        Mohon maaf, alamat ini sudah tidak dapat diakses.
        Silakan gunakan alamat resmi
        <a href="https://sip.puskesmastrenggalek.id"
           class="text-green-400 hover:underline font-medium">
          sip.puskesmastrenggalek.id
        </a>
      </p>

      <p class="text-center text-xs text-gray-300 mt-2">
        Dialihkan otomatis dalam
        <span id="countdown" class="font-semibold text-white">10</span>
        detik
      </p>

    </div>
  </div>

  <!-- Countdown Script -->
  <script>
    let timeLeft = 10;
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "https://sip.puskesmastrenggalek.id";
      }
    }, 1000);
  </script>

</body>
</html>
