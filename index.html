<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>404 - Tersesat di Angkasa</title>
    
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Google: Nunito untuk kesan yang bulat dan lucu -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Konfigurasi Tailwind & Custom CSS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        space: {
                            900: '#0f172a',
                            800: '#1e1b4b',
                            light: '#a5b4fc'
                        },
                        cute: {
                            pink: '#f472b6',
                            blue: '#60a5fa'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden; /* Mencegah scrollbar muncul karena parallax */
        }

        /* Custom Styles untuk Bintang */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* CSS Art: Antarmiksana */
        .astronaut-container {
            position: relative;
            width: 120px;
            height: 160px;
        }

        /* Tubuh */
        .body {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 80px;
            height: 100px;
            background: white;
            border-radius: 40px;
            z-index: 10;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
        }

        /* Kepala/Helm */
        .helmet {
            position: absolute;
            top: 0;
            left: 15px;
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Kaca Visor */
        .visor {
            position: absolute;
            top: 20px;
            left: 15px;
            width: 60px;
            height: 55px;
            background: linear-gradient(135deg, #1e293b, #334155);
            border-radius: 30px 30px 40px 40px;
            z-index: 25;
            overflow: hidden;
            border: 2px solid #e2e8f0;
        }

        /* Pantulan di kaca */
        .visor::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 20px;
            height: 10px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: rotate(-45deg);
        }

        /* Tangan */
        .arm {
            position: absolute;
            width: 25px;
            height: 70px;
            background: white;
            border-radius: 15px;
            z-index: 15;
        }
        .arm.left { left: 0; top: 30px; transform: rotate(15deg); }
        .arm.right { right: 0; top: 30px; transform: rotate(-15deg); }

        /* Kaki */
        .leg {
            position: absolute;
            width: 30px;
            height: 50px;
            background: #e2e8f0;
            border-radius: 15px;
            z-index: 5;
        }
        .leg.left { left: 25px; bottom: -10px; }
        .leg.right { right: 25px; bottom: -10px; }

        /* Aksesoris Tabung Oksigen */
        .backpack {
            position: absolute;
            width: 90px;
            height: 70px;
            background: #cbd5e1;
            border-radius: 20px;
            top: 40px;
            left: 15px;
            z-index: 5;
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-space-900 via-indigo-950 to-space-900 text-white h-screen flex flex-col items-center justify-center selection:bg-cute-pink selection:text-white">

    <!-- Latar Belakang Bintang -->
    <div id="stars-container" class="absolute inset-0 overflow-hidden pointer-events-none">
        <!-- Bintang akan digenerate oleh JS -->
    </div>

    <!-- Container Utama (Untuk Parallax) -->
    <main id="main-content" class="relative z-10 text-center flex flex-col items-center px-4 transition-transform duration-100 ease-out">
        
        <!-- Elemen Visual: Planet Dekoratif -->
        <div class="absolute -top-20 -left-20 w-32 h-32 bg-gradient-to-tr from-cute-pink to-purple-500 rounded-full blur-2xl opacity-40 animate-pulse-slow"></div>
        <div class="absolute top-40 -right-10 w-24 h-24 bg-gradient-to-tr from-cute-blue to-cyan-500 rounded-full blur-xl opacity-30 animate-pulse-slow" style="animation-delay: 2s;"></div>

        <!-- Astronaut CSS Art -->
        <div class="astronaut-container animate-float mx-auto mb-8 cursor-grab active:cursor-grabbing" title="Aku tersesat :(">
            <div class="backpack"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="body"></div>
            <div class="helmet">
                <div class="visor"></div>
            </div>
        </div>

        <!-- Teks Utama -->
        <h1 class="text-8xl md:text-9xl font-black tracking-tighter mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cute-pink via-purple-200 to-cute-blue drop-shadow-[0_0_15px_rgba(192,132,252,0.5)]">
            404
        </h1>
        
        <h2 class="text-2xl md:text-3xl font-bold mb-4 text-slate-200">
            Ups! Tersesat di Angkasa?
        </h2>
        
        <p class="text-slate-400 max-w-md mx-auto mb-8 text-lg leading-relaxed">
            Halaman yang kamu cari mungkin telah hancur saat melintasi lubang cacing, atau mungkin memang tidak ada sejak awal.
        </p>

        <!-- Tombol Aksi -->
       <!--  <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
            <button onclick="navigateHome()" class="px-8 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-purple-500/30 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Kembali ke Beranda
            </button>
            
            <button onclick="contactSupport()" class="px-8 py-3 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-full border border-white/20 backdrop-blur-sm transition hover:border-cute-blue/50 focus:outline-none focus:ring-4 focus:ring-white/10">
                Laporkan Masalah
            </button>
        </div> -->
    </main>

    <!-- Footer Kecil -->
    <footer class="absolute bottom-4 text-slate-600 text-sm font-medium">
        © 2025 Penjelajah Galaksi @Yoga
    </footer>

    <!-- Toast Notification Element -->
    <div id="toast">Pesan notifikasi</div>

    <!-- JavaScript Logika -->
    <script>
        // 1. Generate Bintang secara dinamis
        const starsContainer = document.getElementById('stars-container');
        const starCount = 150;

        function createStars() {
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Posisi acak
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // Ukuran acak (kecil hingga sedang)
                const size = Math.random() * 3 + 1;
                
                // Durasi animasi acak agar tidak sinkron
                const duration = Math.random() * 3 + 2; 
                const delay = Math.random() * 5;

                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--delay', `${delay}s`);

                starsContainer.appendChild(star);
            }
        }

        createStars();

        // 2. Logika Parallax Effect (Mouse Movement)
        const mainContent = document.getElementById('main-content');
        const astronaut = document.querySelector('.astronaut-container');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;

            // Gerakkan background bintang sedikit ( efek jauh )
            starsContainer.style.transform = `translateX(${x * 0.5}px) translateY(${y * 0.5}px)`;

            // Gerakkan konten utama berlawanan arah mouse
            mainContent.style.transform = `translateX(${x}px) translateY(${y}px)`;
            
            // Gerakkan astronaut sedikit lebih banyak agar terlihat melayang bebas
            // Tambahkan rotasi sedikit saat mouse bergerak
            astronaut.style.transform = `translateX(${x * 1.5}px) translateY(${y * 1.5}px) rotate(${x * 0.5}deg)`;
        });

        // Reset posisi saat mouse keluar window
        document.addEventListener('mouseleave', () => {
            mainContent.style.transform = `translateX(0) translateY(0)`;
            astronaut.style.transform = `translateX(0) translateY(0) rotate(0deg)`;
        });

        // 3. Fungsi Toast Notification (Pengganti Alert)
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            
            // Sembunyikan setelah 3 detik
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }

        // 4. Interaksi Tombol
        function navigateHome() {
            // Dalam aplikasi nyata, ini akan window.location.href = '/';
            // Di sini kita simulasi dengan toast
            showToast("🚀 Meluncur kembali ke Beranda...");
            
            // Efek visual tombol ditekan
            const btn = event.currentTarget;
            btn.innerHTML = "Sedang Memuat...";
            setTimeout(() => {
                btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg> Kembali ke Beranda`;
            }, 2000);
        }

        function contactSupport() {
            showToast("📡 Mengirim sinyal SOS ke pusat...");
        }
    </script>
</body>
</html>
