<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengalihan Alamat</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Auto Redirect -->
  <meta http-equiv="refresh" content="5;url=https://sip.puskesmastrenggalek.id">

  <style>
    body {
      background-image: url('https://cdn.dribbble.com/userupload/41802618/file/original-30bd81eb7c805503b995ab442f08b739.gif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeInUp 1s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

  <!-- Overlay -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

  <!-- Content -->
  <div class="relative bg-white/90 rounded-2xl shadow-2xl p-8 max-w-lg text-center animate-fade-in">

    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="bg-green-100 text-green-600 p-4 rounded-full animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M12 18a9 9 0 100-18 9 9 0 000 18z" />
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-800 mb-2">
      Mohon Maaf 🙏
    </h1>

    <!-- Message -->
    <p class="text-gray-600 mb-6 leading-relaxed">
      Alamat ini <strong>sudah tidak dapat diakses</strong>.<br>
      Anda akan dialihkan ke sistem resmi
      <strong>Puskesmas Trenggalek</strong>.
    </p>

    <!-- Redirect Button -->
    <a href="https://sip.puskesmastrenggalek.id"
       class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-lg transition transform hover:scale-105 animate-pulse">
      Menuju SIP Puskesmas Trenggalek
    </a>

    <!-- Footer -->
    <p class="text-sm text-gray-500 mt-6">
      Pengalihan otomatis dalam 5 detik...
    </p>
  </div>

</body>
</html>
