<!-- 🔹 Card tambahan: Penjaringan Data Eksternal -->
<div class="row justify-content-center mt-5">
  <div class="col-lg-8">
    <div class="card card-menu p-4 text-center">
      <div class="card-icon mb-3">
        <i class="fa-solid fa-share-nodes"></i>
      </div>
      <h5 class="card-title mb-3">Penjaringan Data Eksternal</h5>
      <p class="card-text mb-3">
        Penjaringan data dari pihak eksternal dapat dilakukan melalui link
        berikut. Anda dapat menyalin link ini dan membagikannya.
      </p>
      <div class="input-group">
        <input
          id="externalLink"
          type="text"
          class="form-control"
          value="https://pkmtrenggalek.github.io/Data_kelahiran-Kematian/"
          readonly
        />
        <button class="btn btn-success" type="button" id="copyButton">
          <i class="fa-regular fa-copy me-1"></i>Copy
        </button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const copyButton = document.getElementById("copyButton");
    const externalLink = document.getElementById("externalLink");

    copyButton.addEventListener("click", function () {
      // Coba pakai Clipboard API modern
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard
          .writeText(externalLink.value)
          .then(showSuccess)
          .catch(() => fallbackCopy());
      } else {
        // Jika dari file lokal atau clipboard API gagal
        fallbackCopy();
      }
    });

    function fallbackCopy() {
      externalLink.select();
      externalLink.setSelectionRange(0, 99999);
      document.execCommand("copy");
      showSuccess();
    }

    function showSuccess() {
      copyButton.innerHTML = '<i class="fa-solid fa-check me-1"></i>Copied!';
      copyButton.classList.add("btn-outline-success");
      setTimeout(() => {
        copyButton.innerHTML = '<i class="fa-regular fa-copy me-1"></i>Copy';
        copyButton.classList.remove("btn-outline-success");
      }, 2000);
    }
  });
</script>
